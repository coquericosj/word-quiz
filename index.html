<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-title" content="단어장">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>단어장</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap">
<style>
/* Layout: one narrow column like a pocket word card. Category colors follow the paper word maps (어원 청록, 이미지 갈색, 여러 뜻 보라, 헷갈리는 짝 장미). Grading marks are a red pen: circle for right, slash for wrong. */
:root{
  --bg:#F4F6F3;--surface:#FFFFFF;--track:#E7EBE7;--ink:#1E2523;--ink-2:#5A6561;--line:#D8DED9;
  --accent:#2E5B50;--accent-ink:#FFFFFF;--accent-soft:#E2EEE9;
  --pen:#CF3A2F;--pen-ink:#FFFFFF;--pen-soft:#FBE9E6;
  --root:#2F6455;--root-soft:#E3EFEA;--image:#87552A;--image-soft:#F6ECDC;
  --multi:#5A5080;--multi-soft:#ECE9F4;--pair:#8C4460;--pair-soft:#F6E6ED;
  --shadow:0 1px 2px rgb(20 32 28 / .06),0 6px 18px rgb(20 32 28 / .05);
  --f-ui:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',system-ui,sans-serif;
  --f-word:'Source Serif 4','Noto Serif',Georgia,'Times New Roman',serif;
  --f-mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111514;--surface:#1A1F1E;--track:#252C2A;--ink:#E6EBE8;--ink-2:#9BA8A3;--line:#2E3734;
  --accent:#86C6B2;--accent-ink:#0E1A16;--accent-soft:#1D2E29;
  --pen:#FF7B6F;--pen-ink:#2A0F0C;--pen-soft:#35201D;
  --root:#8DCBB8;--root-soft:#1C2D28;--image:#E3B27F;--image-soft:#2D2418;
  --multi:#B9AEE0;--multi-soft:#252239;--pair:#E9A0BC;--pair-soft:#33202A;
  --shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111514;--surface:#1A1F1E;--track:#252C2A;--ink:#E6EBE8;--ink-2:#9BA8A3;--line:#2E3734;
  --accent:#86C6B2;--accent-ink:#0E1A16;--accent-soft:#1D2E29;
  --pen:#FF7B6F;--pen-ink:#2A0F0C;--pen-soft:#35201D;
  --root:#8DCBB8;--root-soft:#1C2D28;--image:#E3B27F;--image-soft:#2D2418;
  --multi:#B9AEE0;--multi-soft:#252239;--pair:#E9A0BC;--pair-soft:#33202A;
  --shadow:none;color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.55;word-break:keep-all;overflow-wrap:break-word;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-tap-highlight-color:transparent}
p,h1,h2,h3,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[lang="en"]{word-break:normal}

.wrap{max-width:480px;margin:0 auto;padding-block:16px 56px;display:flex;flex-direction:column;gap:16px}
body.in-quiz .wrap{padding-block-end:128px}
main>section{display:flex;flex-direction:column;gap:16px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:4px}
.bname{font-size:19px;font-weight:700;letter-spacing:-0.01em;line-height:1.3}
.bdate{font-size:13px;color:var(--ink-2)}
.streak{flex:none;font-size:13px;font-weight:700;padding:6px 11px;border-radius:999px;background:var(--pen-soft);color:var(--pen);font-variant-numeric:tabular-nums}

/* tabs */
.tabs{display:grid;grid-template-columns:repeat(2,1fr);gap:4px;padding:4px;border-radius:12px;background:var(--track)}
.tab{border:0;background:transparent;padding:9px 0;border-radius:9px;font-size:15px;font-weight:500;color:var(--ink-2)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:var(--shadow)}

/* shared */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 18px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow)}
.h2{font-size:20px;font-weight:700;letter-spacing:-0.01em;line-height:1.35;text-wrap:balance}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--ink-2)}
.sub,.note{font-size:14px;color:var(--ink-2)}
.status{font-size:14px;color:var(--ink-2);display:flex;align-items:center;gap:8px}
.status b{color:var(--ink);font-weight:700}
.status .dot{width:8px;height:8px;border-radius:50%;background:var(--track);flex:none}
.status.done .dot{background:var(--accent)}
.warn{font-size:14px;padding:12px 14px;border-radius:12px;background:var(--pen-soft);color:var(--ink)}

.btn{display:block;width:100%;border:0;border-radius:12px;padding:15px 16px;font-size:17px;font-weight:700;background:var(--accent);color:var(--accent-ink);text-align:center}
.btn.pen{background:var(--pen);color:var(--pen-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn:active{transform:translateY(1px)}
.sbtn{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;font-size:14px;font-weight:500}
.sbtn.danger{border-color:var(--pen);color:var(--pen)}
.linkbtn{border:0;background:none;padding:6px 0;font-size:14px;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;align-self:center}

.field{display:flex;flex-direction:column;gap:8px}
.lab{font-size:13px;font-weight:700;color:var(--ink-2);letter-spacing:.02em}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.segb{border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 14px;font-size:15px;font-weight:500}
.segb small{font-size:12px;font-weight:500;opacity:.75;margin-left:4px;font-variant-numeric:tabular-nums}
.lab-s{font-weight:500;letter-spacing:0;margin-left:6px;opacity:.85}
.grid5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.grid5 .segb{padding:8px 0;text-align:center;font-variant-numeric:tabular-nums}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.grid4 .segb{display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 0;border-radius:12px}
.grid4 .segb small{margin-left:0}
.book{--g:var(--accent);--gs:var(--accent-soft)}
.no{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums;align-self:center}
.wtop .chip{font-size:11px;padding:1px 7px;align-self:center}
.segb[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.pool{font-size:14px;color:var(--ink-2);line-height:1.6}
.pool b{color:var(--ink)}

.rev{background:var(--pen-soft);border-color:transparent;box-shadow:none}
.rev .eyebrow{color:var(--pen)}
.pen-n{color:var(--pen);font-variant-numeric:tabular-nums}

/* category tint */
.root{--g:var(--root);--gs:var(--root-soft)}
.image{--g:var(--image);--gs:var(--image-soft)}
.multi{--g:var(--multi);--gs:var(--multi-soft)}
.pair{--g:var(--pair);--gs:var(--pair-soft)}
.chip{font-size:12px;font-weight:700;padding:3px 9px;border-radius:6px;background:var(--gs);color:var(--g)}
.hint{padding:10px 12px;border-radius:10px;background:var(--gs);font-size:14.5px;line-height:1.65;color:var(--ink)}
.hint-l{display:block;font-size:11.5px;font-weight:700;letter-spacing:.04em;color:var(--g);margin-bottom:2px}

/* red-pen marks */
.ringed{position:relative;display:inline-grid;place-items:center}
.mk{position:absolute;pointer-events:none;overflow:visible;fill:none;stroke:var(--pen);stroke-linecap:round;stroke-linejoin:round}
.ringed>.mk{top:-8px;left:-8px;width:calc(100% + 16px);height:calc(100% + 16px);stroke-width:3}
.mk path{stroke-dasharray:1;stroke-dashoffset:0;animation:draw .42s ease-out both}
.mk.wide{top:-9px;left:-14px;width:calc(100% + 28px);height:calc(100% + 18px);stroke-width:2.5;animation:reveal .45s ease-out both}
.mk.wide path{stroke-dasharray:none;animation:none}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes reveal{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}

/* quiz */
.qbar{display:flex;align-items:center;gap:12px;min-height:40px}
.prog{flex:1;height:6px;border-radius:3px;background:var(--track);overflow:hidden}
.prog span{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .3s ease}
.qcount{min-width:4em;text-align:right;font-size:14px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.quitask{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:12px;background:var(--pen-soft)}
.quitask .row{display:flex;gap:8px;justify-content:flex-end}

.qcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px 18px 24px;display:flex;flex-direction:column;gap:18px;box-shadow:var(--shadow)}
.chiprow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dayl{font-size:12px;color:var(--ink-2);font-weight:500}
.ask{font-size:14px;color:var(--ink-2);margin-bottom:-8px}
.hw{display:flex;flex-direction:column;gap:2px}
.headword{font-family:var(--f-word);font-size:46px;font-weight:600;line-height:1.1;letter-spacing:-0.01em;overflow-wrap:anywhere}
.ipa{font-family:var(--f-word);font-size:16px;color:var(--ink-2)}
.mprompt{font-size:24px;font-weight:700;line-height:1.4;text-wrap:balance}

.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:11px 14px;text-align:left;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);font-size:16px;line-height:1.45}
.opt:not(:disabled):hover{border-color:var(--ink-2)}
.opt .num{flex:none;width:26px;height:26px;font-size:19px;color:var(--ink-2)}
.opt .otx{min-width:0}
.opt.right{border-color:var(--accent);background:var(--accent-soft)}
.opt.right .num{color:var(--ink)}
.opt.wrong{color:var(--ink-2)}
.opt:disabled:not(.right):not(.wrong){opacity:.6}

.tiles{display:grid;grid-template-columns:repeat(var(--n),minmax(0,38px));justify-content:center;gap:5px}
.tile{aspect-ratio:1/1.2;display:grid;place-items:center;font-family:var(--f-mono);font-size:clamp(15px,5.2vw,22px);font-weight:600;border-bottom:2.5px solid var(--line);color:var(--ink)}
.tile.ghost{color:var(--ink-2);opacity:.5}
.tile.hinted{color:var(--accent);opacity:.75}
.hintline{text-align:center;font-size:14px;color:var(--ink-2)}
.hintline span{font-family:var(--f-mono);font-size:17px;font-weight:600;color:var(--accent);letter-spacing:.04em;margin-left:6px}
.tag{font-size:11px;font-weight:700;color:var(--accent);border:1px solid var(--accent);border-radius:5px;padding:0 5px;align-self:center}
.tile.cur{border-bottom-color:var(--accent)}
.tile.over{color:var(--pen);border-bottom-color:var(--pen)}
.len{text-align:center;font-size:14px;color:var(--ink-2)}
.len b{font-family:var(--f-mono);color:var(--ink)}
.spell{display:flex;gap:8px}
#spellIn,#gIn{flex:1;min-width:0;font-family:var(--f-mono);font-size:22px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
#spellIn:focus,#gIn:focus{outline:none;border-color:var(--accent)}
.spell .btn{width:auto;flex:none;padding:0 20px}
.imewarn{font-size:14px;color:var(--pen);text-align:center}

.sres{display:flex;flex-direction:column;gap:12px;align-items:flex-start;padding:4px 0}
.sres p{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.lbl{font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--ink-2);min-width:2.6em}
.sword{position:relative;display:inline-block;font-family:var(--f-mono);font-size:26px;font-weight:600;letter-spacing:.05em}
.sword .miss{color:var(--pen);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:5px}
.given{position:relative;display:inline-block;font-family:var(--f-mono);font-size:20px;color:var(--ink-2)}
.given.empty{font-family:var(--f-ui);font-size:15px}

.fb{border-top:1.5px dashed var(--line);padding-top:16px;display:flex;flex-direction:column;gap:10px}
.fb-h{font-size:15px;font-weight:700}
.fb-h.ok{color:var(--accent)}
.fb-h.no{color:var(--pen)}
.fb-h.skip{color:var(--ink-2)}
.oops{align-self:flex-start;padding-top:2px}
.fb-w{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px}
.fb-w b{font-family:var(--f-word);font-size:22px;font-weight:600}
.fb-m{font-size:15px}

#nextbar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--bg);border-top:1px solid var(--line);
  padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.nb-in{max-width:480px;margin:0 auto}

/* listening */
.spk{flex:none;display:inline-grid;place-items:center;width:36px;height:36px;padding:0;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--accent)}
.spk svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.spk:active{background:var(--accent-soft)}
.spk.big{width:76px;height:76px;border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.spk.big svg{width:34px;height:34px}
.hwrow{display:flex;align-items:center;gap:14px}
.listen{display:flex;align-items:center;justify-content:center;gap:14px;padding:4px 0}
.lmean{text-align:center;font-size:16px;color:var(--ink-2)}
.lmean b{color:var(--ink);font-weight:700}
.fb-w .spk{width:32px;height:32px;align-self:center}
.wtop .spk{width:30px;height:30px;margin-left:auto;align-self:center}
.wtop .spk svg{width:15px;height:15px}
.sbtn[aria-pressed="false"]{color:var(--ink-2)}

/* result */
.res{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:16px 0 4px}
.score{position:relative;display:inline-flex;align-items:baseline;gap:8px;font-family:var(--f-word);padding:0 6px}
.sc-n{font-size:76px;font-weight:600;line-height:1;color:var(--pen);font-variant-numeric:tabular-nums}
.sc-d{font-size:28px;color:var(--ink-2)}
.res-msg{font-size:16px;line-height:1.6;max-width:30ch}
.sh{font-size:16px;font-weight:700}
.wlist{display:flex;flex-direction:column;gap:14px}
.wlist li{display:flex;flex-direction:column;gap:8px;padding-bottom:14px;border-bottom:1px dashed var(--line)}
.wlist li:last-child{border-bottom:0;padding-bottom:0}
.actions{display:flex;flex-direction:column;gap:10px}
.copyfb textarea{width:100%;font:inherit;font-size:14px;padding:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);resize:vertical}

/* words */
.wtools{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.gsec{display:flex;flex-direction:column;gap:10px}
.gh{align-self:flex-start;font-size:14px;font-weight:700;padding:5px 12px;border-radius:8px;background:var(--g);color:var(--surface)}
.gh small{font-weight:500;opacity:.8;margin-left:4px}
.wl{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.wrow{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.wrow:last-child{border-bottom:0}
.wtop{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.ww{font-family:var(--f-word);font-size:20px;font-weight:600}
.wtop .ipa{font-size:14px}
.rv{font-size:11px;font-weight:700;color:var(--pen);border:1px solid var(--pen);border-radius:5px;padding:0 5px;align-self:center}
.wm{font-size:15px;font-weight:500}
.wh{font-size:13.5px;color:var(--ink-2);line-height:1.6}
.cover .wrow{cursor:pointer}
.cover .wrow:not(.show) .wm{color:transparent;background:var(--track);border-radius:5px;user-select:none}
.cover .wrow:not(.show) .wh{display:none}

/* log */
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cell{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.cell.today{border:2px solid var(--accent)}
.cell .wd{font-size:11px;color:var(--ink-2)}
.cell .dn{width:28px;height:28px;font-weight:600;font-variant-numeric:tabular-nums}
.cell .dn .mk path{animation:none}
.cell .cnt{font-size:11px;color:var(--pen);min-height:1.5em;font-weight:700}
.kpis{display:flex;gap:18px;flex-wrap:wrap;font-size:14px;color:var(--ink-2)}
.kpis b{font-size:20px;color:var(--ink);margin-right:2px;font-variant-numeric:tabular-nums}
.mrow{display:flex;flex-direction:column;gap:6px}
.mtop{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.mtop b{font-weight:700}
.mtop span{color:var(--ink-2);font-variant-numeric:tabular-nums}
.mbar{height:8px;border-radius:4px;background:var(--track);overflow:hidden}
.mbar span{display:block;height:100%;background:var(--accent)}
.msub{font-size:13px;color:var(--ink-2)}
.dgroup{display:flex;flex-direction:column;gap:6px}
.dhead{font-size:13px;font-weight:700;color:var(--ink-2)}
.srow{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:baseline;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.srow .t{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.srow .l{font-size:15px;min-width:0}
.srow .s{font-weight:700;font-variant-numeric:tabular-nums}
.srow .s.full{color:var(--pen)}
.srow .w{grid-column:1/-1;font-size:13px;color:var(--ink-2)}
.srow .w span{font-family:var(--f-mono);color:var(--pen)}
.empty{padding:28px 16px;text-align:center;color:var(--ink-2);font-size:15px;background:var(--surface);border:1.5px dashed var(--line);border-radius:14px}
.foot{font-size:13px;color:var(--ink-2);line-height:1.6}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:6;max-width:calc(100% - 32px);
  background:var(--ink);color:var(--bg);font-size:14px;padding:10px 16px;border-radius:999px;box-shadow:var(--shadow)}

/* review tidy */
.rev-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.tidy{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.tidy-q{font-size:15px;font-weight:700}
.btn small{display:block;font-size:12.5px;font-weight:500;opacity:.85;margin-top:2px}
.linkbtn.inline{display:inline;padding:0 0 0 8px;font-size:inherit;color:var(--ink-2)}

/* game: sticky score board on top, question card under it */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.board{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;display:flex;flex-direction:column;gap:6px;padding-block:6px 10px;background:var(--bg)}
.prow{display:grid;grid-template-columns:34px minmax(0,1fr) auto;align-items:center;gap:10px;padding:9px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.prow.op .av{background:var(--multi);color:var(--surface)}
.pmid{display:flex;flex-direction:column;gap:6px;min-width:0}
.pname{display:flex;align-items:baseline;gap:8px;font-size:14px;font-weight:700;min-width:0}
.pname .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pstat{flex:none;font-size:12px;font-weight:500;color:var(--ink-2)}
.pstat.good{color:var(--accent);font-weight:700}
.pstat.bad{color:var(--pen)}
.pbar{height:8px;border-radius:4px;background:var(--track);overflow:hidden}
.pbar span{display:block;width:0;height:100%;border-radius:4px;background:var(--accent);transition:width .35s ease}
.prow.op .pbar span{background:var(--multi)}
.pcnt{position:relative;min-width:3.4em;text-align:right;font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.pcnt small{font-size:13px;font-weight:500;color:var(--ink-2);margin-left:1px}
.pop{position:absolute;right:0;top:-12px;font-size:13px;font-weight:700;color:var(--accent);pointer-events:none;animation:pop .9s ease-out forwards}
.prow.op .pop{color:var(--multi)}
@keyframes pop{from{opacity:1;transform:translateY(6px)}to{opacity:0;transform:translateY(-10px)}}
.gnum{font-family:var(--f-word);font-size:64px;font-weight:600;line-height:1.1;color:var(--pen);text-align:center}
.gfb{min-height:1.6em;font-size:16px;font-weight:700}
.gfb.ok{color:var(--accent)}
.gfb.no{color:var(--pen)}
.gfb b{font-family:var(--f-mono);font-size:19px;letter-spacing:.04em}
.gfoot{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.gwin{position:relative;display:inline-block;padding:0 12px;font-size:40px;font-weight:700;line-height:1.3}
.gwin.win{color:var(--pen)}
.gscore{display:flex;align-items:baseline;gap:12px;font-size:16px;color:var(--ink-2)}
.gscore b{font-size:30px;color:var(--ink);font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){.pop{display:none}.pbar span{transition:none}}

@media (prefers-reduced-motion:reduce){
  .mk path,.mk.wide{animation:none}
  .prog span{transition:none}
}
</style>
</head>

const $=(s,r=document)=>r.querySelector(s);
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function today(){return ymd(new Date());}
function addDays(s,n){const [y,m,d]=s.split('-').map(Number);return ymd(new Date(y,m-1,d+n));}
function fmtDate(s){const [y,m,d]=s.split('-').map(Number);return `${m}월 ${d}일 (${WD[new Date(y,m-1,d).getDay()]})`;}
function hhmm(d){return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function norm(s){return String(s).normalize('NFKC').trim().toLowerCase().replace(/\s+/g,' ').replace(/[‐-―−]/g,'-');}

const TTS=('speechSynthesis' in window&&'SpeechSynthesisUtterance' in window)?window.speechSynthesis:null;

function pickVoice(){
  if(!TTS)return;
  const vs=TTS.getVoices()||[];
  VOICE=vs.find(v=>/^en[-_]US/i.test(v.lang)&&/Samantha|Google US|Aria|Jenny|Ava|Allison/i.test(v.name))
    ||vs.find(v=>/^en[-_]US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null;
}
if(TTS){pickVoice();try{TTS.onvoiceschanged=pickVoice;}catch(e){}}
function speak(text,rate){
  if(!TTS)return;
  try{
    TTS.cancel();
    const u=new SpeechSynthesisUtterance(String(text).replace(/-/g,' '));
    u.lang='en-US';if(VOICE)u.voice=VOICE;u.rate=rate||0.85;
    TTS.speak(u);
  }catch(e){}
}

function blank(){return{stats:{},review:{},played:{},game:{r:0.45,tpc:12000},prefs:{days:[String(DAYS[DAYS.length-1])],groups:GRPS.slice(),mode:'mix',n:20,sound:true}};}
function load(){
  const b=blank();let o=null;
  try{const r=localStorage.getItem(KEY);if(r)o=JSON.parse(r);localStorage.setItem(KEY+'-t','1');localStorage.removeItem(KEY+'-t');}
  catch(e){canStore=false;}
  if(o&&typeof o==='object'){
    if(o.stats&&typeof o.stats==='object')b.stats=o.stats;
    if(o.review&&typeof o.review==='object')b.review=o.review;
    if(o.played&&typeof o.played==='object')b.played=o.played;
    if(o.game&&typeof o.game==='object')b.game=o.game;
    /* 예전 점수 기록은 날짜별 횟수만 남기고 지움 */
    if(Array.isArray(o.history))o.history.forEach(h=>{if(h&&h.kind!=='practice'&&h.date)b.played[h.date]=(b.played[h.date]||0)+1;});
    if(o.prefs&&typeof o.prefs==='object')Object.assign(b.prefs,o.prefs);
  }
  const P=b.prefs,last=String(DAYS[DAYS.length-1]);
  if(!(o&&o.prefs&&Array.isArray(o.prefs.days)))P.days=(P.day&&DAYS.includes(Number(P.day)))?[String(P.day)]:[last]; /* 예전 한 Day 설정 이어받기 */
  delete P.day;
  P.days=P.days.map(String).filter((d,i,a)=>DAYS.includes(Number(d))&&a.indexOf(d)===i).slice(-2);
  if(!P.days.length)P.days=[last];
  if(!Array.isArray(P.groups))P.groups=GRPS.slice();
  P.groups=GRPS.filter(g=>P.groups.includes(g));
  if(!P.groups.length)P.groups=GRPS.slice();
  if(!MODES[P.mode]||(P.mode==='listen'&&!TTS))P.mode='mix';
  if(typeof P.sound!=='boolean')P.sound=true;
  if(P.n==='all')P.n=40;
  if(P.n===15)P.n=20;
  P.n=Number(P.n);
  if(!(P.n>=10&&P.n<=80&&P.n%10===0))P.n=20;
  return b;
}

function selPool(days,groups){return WORDS.filter(x=>days.includes(String(x.d))&&groups.includes(grp(x)));}
function daysLabel(days){return 'Day '+days.slice().sort((a,b)=>a-b).join('·');}
function groupsLabel(gs){return gs.length===GRPS.length?'전체':gs.join('·');}
/* 문제 수 선택지: 10·20·40·80 중 고른 단어 수보다 적은 것 + 전체 */
function nOptions(L){const o=[10,20,40,80].filter(v=>v<L);o.push(L);return o;}
function effN(n,L){const o=nOptions(L),want=Math.min(n,L);let e=o[0];for(const v of o)if(v<=want)e=v;return e;}
function dueWords(){const t=today();return Object.keys(S.review).filter(k=>BYW[k]&&S.review[k].due<=t).map(k=>BYW[k]);}
function prunePlayed(){const cut=addDays(today(),-120);for(const k of Object.keys(S.played))if(k<cut)delete S.played[k];}
function streak(){
  const P=S.played;let d=today();
  if(!P[d])d=addDays(d,-1);
  let n=0;while(P[d]){n++;d=addDays(d,-1);}return n;
}

/* ---------- 문제 만들기 ---------- */
function toks(m){return m.split(/[\s,;·()]+/).filter(t=>t.length>=2);}
function clash(a,b){
  if(a.w===b.w||a.m===b.m)return true;
  if(CONFLICT.some(g=>g.includes(a.w)&&g.includes(b.w)))return true;
  const ta=toks(a.m);return toks(b.m).some(t=>ta.includes(t));
}
function makeOptions(w,pos){
  const L=w.m.length;
  const cands=shuffle(WORDS.filter(x=>!clash(w,x))).sort((a,b)=>Math.abs(a.m.length-L)-Math.abs(b.m.length-L));
  const pick=[];
  for(const c of shuffle(cands.slice(0,9))){if(pick.length===3)break;if(!pick.some(p=>clash(p,c)))pick.push(c);}
  for(const c of cands){if(pick.length===3)break;if(!pick.includes(c)&&!pick.some(p=>clash(p,c)))pick.push(c);}
  const opts=pick.map(x=>({m:x.m,ok:false}));
  opts.splice(pos,0,{m:w.m,ok:true});
  return opts;
}
function buildItems(words,mode){
  const cyc=(TTS&&S.prefs.sound)?['mc','spell','listen']:['mc','spell'];
  const modes=mode==='mix'?shuffle(words.map((_,i)=>cyc[i%cyc.length])):words.map(()=>mode);
  const mcN=modes.filter(m=>m==='mc').length;
  const pos=shuffle(Array.from({length:mcN},(_,i)=>i%4)); /* 정답 번호를 ①~④에 고르게 */
  let k=0;
  return words.map((w,i)=>{
    const it={w,mode:modes[i],done:false,ok:false,given:'',draft:''};
    if(it.mode==='mc'){it.pos=pos[k++];it.opts=makeOptions(w,it.pos);}
    return it;
  });
}

}
function autoSpeak(){

}

  startQuiz(shuffle(pl.slice()).slice(0,n),'new',`${daysLabel(P.days)} ${groupsLabel(P.groups)}`,P.mode);
}

/* 힌트: 세 칸마다 한 글자 + 마지막 글자 */
function hintIdx(word){const s=new Set();for(let i=0;i<word.length;i++)if(i%3===0&&word[i]!=='-')s.add(i);s.add(word.length-1);return s;}
function hintPattern(word){const s=hintIdx(word);return [...word].map((c,i)=>c==='-'?'-':s.has(i)?c:'_').join(' ');}
function tiles(word,typed,first=true,hint=false){
  const n=Math.max(word.length,typed.length),hs=hint?hintIdx(word):new Set();let h='';
  for(let i=0;i<n;i++){
    const c=typed[i];let cls='tile',ch='';
    if(c!==undefined){ch=c;cls+=' on';}
    else if(hs.has(i)){ch=word[i];cls+=' ghost hinted';}
    else if(i===0&&first){ch=word[0];cls+=' ghost';}
    else if(word[i]==='-'){ch='-';cls+=' ghost';}
    if(i>=word.length)cls+=' over';
    if(i===typed.length)cls+=' cur';
    h+=`<span class="${cls}">${esc(ch)}</span>`;
  }
  return `<div class="tiles" id="tiles" lang="en" style="--n:${n}" aria-hidden="true">${h}</div>`;
}
function typedOf(v){return String(v).replace(/^\s+/,'').toLowerCase();}

function spellResult(it){
  const w=it.w.w;
  if(it.ok)return `<div class="sres"><p><span class="lbl">정답</span><span class="sword" lang="en">${esc(w)}${CIRCLE_WIDE}</span></p></div>`;
  const g=it.given;
  const diff=[...w].map((c,i)=>`<span class="${g[i]===c?'':'miss'}">${esc(c)}</span>`).join('');
  return `<div class="sres">
    <p><span class="lbl">내 답</span>${g?`<span class="given" lang="en">${esc(g)}${SLASH_WIDE}</span>`:`<span class="given empty">모르겠어요</span>`}</p>
    <p><span class="lbl">정답</span><span class="sword" lang="en">${diff}</span></p>
  </div>`;
}
function feedback(it){
  const w=it.w;
  const later=Q.kind==='practice'?'':' · 내일 복습에 다시 나와요';
  const head=it.skip?`<p class="fb-h skip">이 문제는 빼고 채점해요</p>`
    :it.ok?(it.hint?`<p class="fb-h ok">힌트 보고 맞혔어요${later}</p>`:`<p class="fb-h ok">정답이에요</p>`)
    :`<p class="fb-h no">아쉬워요${later}</p>`;
  return `<div class="fb">${head}
    <p class="fb-w"><b lang="en">${esc(w.w)}</b>${spk(w.w)}${w.p?`<span class="ipa">[${esc(w.p)}]</span>`:''}<span class="fb-m">${esc(w.m)}</span></p>
    <div class="hint ${w.g}"><span class="hint-l">단어 지도 · ${GROUPS[w.g].full}</span>${esc(w.h)}</div>
    ${it.ok?'':`<button class="linkbtn oops" data-act="oops">${it.skip?'다시 채점에 넣기':'잘못 눌렀어요 · 이 문제 빼기'}</button>`}
  </div>`;
}

function renderQ(){
  const it=Q.items[Q.i],w=it.w,n=Q.items.length,done=it.done;
  const prog=Q.i+(done?1:0);
  const head=Q.quitAsk
    ?`<div class="quitask"><p>지금 그만하면 이번 테스트는 복습에 반영되지 않아요.</p><div class="row"><button class="sbtn" data-act="quit-no">계속하기</button><button class="sbtn danger" data-act="quit-yes">그만하기</button></div></div>`
    :`<div class="qbar"><button class="sbtn" data-act="quit">그만</button>
       <div class="prog" role="progressbar" aria-label="진행" aria-valuemin="0" aria-valuemax="${n}" aria-valuenow="${prog}"><span style="width:${(prog/n*100).toFixed(1)}%"></span></div>
       <span class="qcount">${Q.i+1} / ${n}</span>
       ${TTS?`<button class="sbtn" data-act="sound" aria-pressed="${S.prefs.sound}" aria-label="단어 자동으로 읽어 주기">${S.prefs.sound?'소리 켬':'소리 끔'}</button>`:''}</div>`;
  let body=`<div class="chiprow"><span class="chip ${w.g}">${GROUPS[w.g].name}</span><span class="dayl">Day ${w.d} · ${grp(w)}그룹${Q.kind==='review'?' · 복습':Q.kind==='practice'?' · 다시 풀기':''}</span></div>`;
  if(it.mode==='mc'){
    body+=`<p class="ask">뜻을 고르세요</p>
      <div class="hw"><div class="hwrow"><span class="headword" lang="en">${esc(w.w)}</span>${spk(w.w)}</div>${w.p?`<span class="ipa">[${esc(w.p)}]</span>`:''}</div>
      <div class="opts">${it.opts.map((o,k)=>{
        let cls='opt',mark='';
        if(done){if(o.ok)cls+=' right';if(k===it.choice){if(o.ok)mark=CIRCLE;else{cls+=' wrong';mark=SLASH;}}}
        return `<button class="${cls}" data-act="opt" data-k="${k}"${done?' disabled':''}><span class="num ringed">${NUMS[k]}${mark}</span><span class="otx">${esc(o.m)}</span></button>`;
      }).join('')}</div>`;
  }else{
    const L=it.mode==='listen';
    body+=L
      ?`<p class="ask">듣고 쓰세요</p>
        <div class="listen">${spk(w.w,'big')}<button type="button" class="sbtn" data-act="say-slow">천천히</button></div>
        <p class="lmean">뜻 <b>${esc(w.m)}</b></p>`
      :`<p class="ask">영어로 쓰세요</p><p class="mprompt">${esc(w.m)}</p>`;
    if(!done){
      body+=tiles(w.w,typedOf(it.draft),false,it.hint)+
        (it.hint?`<p class="hintline">힌트<span lang="en">${esc(hintPattern(w.w))}</span></p>`
          :`<p class="len">${w.w.length}글자${w.w.includes('-')?' (하이픈 포함)':''}</p>`)+`
        <form id="spellForm" class="spell" autocomplete="off">
          <input id="spellIn" type="text" lang="en" maxlength="${w.w.length+3}" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="done" aria-label="영어 단어 쓰기" value="${esc(it.draft)}">
          <button class="btn" type="submit">확인</button>
        </form>
        <p class="imewarn" id="imeWarn"${HANGUL.test(it.draft)?'':' hidden'}>영어 자판으로 바꿔서 써 주세요.</p>
        <button class="linkbtn" data-act="giveup">${it.hint?'그래도 모르겠어요':'모르겠어요'}</button>`;
    }else body+=spellResult(it);
  }
  if(done)body+=feedback(it);
  $('#v-quiz').innerHTML=head+`<article class="qcard">${body}</article>`;
  const nb=$('#nextbar');nb.hidden=!done;
  $('#nextBtn').textContent=Q.i===n-1?'결과 보기':'다음';
}
function focusSpell(){const el=$('#spellIn');if(el){try{el.focus({preventScroll:true});}catch(e){el.focus();}}}
function markDone(){
  Q.answeredAt=Date.now();renderQ();
  const it=Q.items[Q.i];if(it.mode==='spell'&&S.prefs.sound)speak(it.w.w);
}
function choose(k){const it=Q.items[Q.i];if(it.done||it.mode!=='mc')return;it.done=true;it.choice=k;it.ok=it.opts[k].ok;it.given=it.opts[k].m;markDone();}
function submitSpell(v){
  const it=Q.items[Q.i];if(it.done)return;
  if(HANGUL.test(v)){$('#imeWarn').hidden=false;focusSpell();return;}
  const g=norm(v);if(!g){focusSpell();return;}
  it.done=true;it.given=g;it.ok=(g===it.w.w.toLowerCase());
  $('#spellIn').blur();markDone();
}
function giveup(){
  const it=Q.items[Q.i];if(it.done)return;
  if(!it.hint){it.hint=true;renderQ();focusSpell();return;} /* 첫 번째는 힌트 */
  it.done=true;it.given='';it.ok=false;markDone();
}
function next(){
  if(!Q)return;const it=Q.items[Q.i];if(!it.done)return;
  if(Q.i>=Q.items.length-1){finish();return;}
  Q.i++;Q.quitAsk=false;renderQ();window.scrollTo(0,0);focusSpell();autoSpeak();
}

function finish(){
  const t=today(),now=new Date();
  const items=Q.items.filter(it=>!it.skip),skipped=Q.items.length-items.length;
  const total=items.length,correct=items.filter(it=>it.ok).length;
  const wrong=items.filter(it=>!it.ok).map(it=>it.w);
  const hinted=items.filter(it=>it.ok&&it.hint).map(it=>it.w);
  if(Q.kind!=='practice'){
    for(const it of items){
      const k=it.w.w;
      const st=S.stats[k]||(S.stats[k]={seen:0,right:0,wrong:0,last:''});
      st.seen++;st.last=t;
      if(!it.ok)st.wrong++;else if(it.hint)st.hint=(st.hint||0)+1;else st.right++;
      const r=S.review[k];
      if(!it.ok||it.hint)S.review[k]={due:addDays(t,1),streak:0}; /* 힌트 보고 맞힌 단어도 내일 다시 */
      else if(r&&r.due<=t){r.streak=(r.streak||0)+1;if(r.streak>=2)delete S.review[k];else r.due=addDays(t,2);}
    }
    S.played[t]=(S.played[t]||0)+1;prunePlayed(); /* 점수는 남기지 않고 한 날짜만 셈 */
    save();
  }
  const rec={date:t,time:hhmm(now),label:Q.label,mode:Q.mode,total,correct,skipped,wrong:wrong.map(x=>x.w),hinted:hinted.map(x=>x.w)};
  R={rec,kind:Q.kind,label:Q.label,mode:Q.mode,total,correct,wrong,hinted,skipped};
  Q=null;show('result');renderResult();renderHeader();
}

function renderResult(){
  const {total,correct,wrong,hinted,kind,label,mode,skipped}=R,ratio=total?correct/total:0;
  const again=wrong.concat(hinted),hs=new Set(hinted.map(w=>w.w));
  const msg=!total?'모든 문제를 뺐어요.':ratio===1&&!hinted.length?'다 맞았어요!':ratio>=.8?'거의 다 외웠어요.':ratio>=.5?'반 넘게 맞혔어요.':'틀린 단어가 곧 외울 단어예요.';
  const parts=[];if(wrong.length)parts.push(`틀린 ${wrong.length}개`);if(hinted.length)parts.push(`힌트 받은 ${hinted.length}개`);
  const tail=kind!=='practice'&&parts.length?` ${parts.join('와 ')}는 내일 복습에 나와요.`:'';
  let h=`<div class="res">
    <p class="eyebrow">${esc(label)} · ${MODES[mode]}</p>
    <p class="score" aria-label="${total}문제 중 ${correct}개 정답"><span class="sc-n">${correct}</span><span class="sc-d">/ ${total}</span>${ratio===1?CIRCLE_WIDE:''}</p>
    <p class="res-msg">${msg}${tail}${skipped&&total?` 잘못 눌러 뺀 ${skipped}문제는 채점하지 않았어요.`:''}</p>
  </div>`;
  if(again.length){
    h+=`<section class="panel"><h2 class="sh">다시 볼 단어 ${again.length}개</h2><ul class="wlist">${again.map(w=>`<li>
      <p class="fb-w"><b lang="en">${esc(w.w)}</b>${spk(w.w)}${hs.has(w.w)?'<span class="tag">힌트</span>':''}<span class="fb-m">${esc(w.m)}</span></p>
      <div class="hint ${w.g}"><span class="hint-l">단어 지도 · ${GROUPS[w.g].full}</span>${esc(w.h)}</div></li>`).join('')}</ul></section>`;
  }
  h+=`<div class="actions">
    ${kind!=='practice'?`<button class="btn" data-act="copy-result">결과 복사해서 엄마에게 보내기</button><div class="copyfb" id="fb-result" hidden></div>`:''}
    ${again.length?`<button class="btn ghost" data-act="retry">다시 볼 단어만 풀기</button>`:''}
    <button class="btn ghost" data-act="home">처음으로</button>
  </div>`;
  $('#v-result').innerHTML=h;
}

function resultText(){

  const lines=[`[단어 테스트] ${fmtDate(r.date)} ${r.time}`,`${r.label} · ${MODES[r.mode]} · ${r.correct}/${r.total}`];
  if(r.wrong.length)lines.push(`틀린 단어: ${r.wrong.join(', ')}`);
  if(r.hinted&&r.hinted.length)lines.push(`힌트 보고 맞힌 단어: ${r.hinted.join(', ')}`);
  if(r.skipped)lines.push(`잘못 눌러 뺀 문제: ${r.skipped}개`);
  if(r.total&&!r.wrong.length&&!(r.hinted&&r.hinted.length))lines.push('다 맞았어요');
  return lines.join('\n');
}

const OP_NAMES=['민트초코','별빛토끼','하늘곰','레몬사탕','초코칩','새벽달','냥냥펀치','딸기우유','파란고래','지우07','서준이','하린','tomato_j','바다별','솜사탕','dolphin22','도토리','노을','코코넛','라임','윤슬','봄비','유니','감자칩'];
let G=null,lastOp='';
function rnd(a,b){return a+Math.random()*(b-a);}
function gameMeta(){
  if(!S.game||typeof S.game!=='object')S.game={};
  const g=S.game;
  if(typeof g.r!=='number'||!isFinite(g.r))g.r=0.45;        /* 상대 실력 0.1~0.9: 이기면 오르고 지면 내려감 */

  return g;
}
function gFocus(){const el=$('#gIn');if(el&&document.activeElement!==el){try{el.focus({preventScroll:true});}catch(e){el.focus();}}}
function startGame(){

  let name;do{name=OP_NAMES[Math.floor(Math.random()*OP_NAMES.length)];}while(name===lastOp);lastOp=name;

function gameTick(){
  if(!G||G.over)return;
  const now=performance.now(),dt=Math.min(now-G.last,400);G.last=now;
  if(document.hidden||G.ask)return; /* 다른 앱으로 나가 있거나 그만할지 묻는 동안은 멈춤 */
  if(G.state==='count'){
    G.countLeft-=dt;
    if(G.countLeft>0){$('#gNum').textContent=String(Math.ceil(G.countLeft/1000));return;}
    G.state='play';$('#gHead').hidden=true;$('#gQ').hidden=false;
    opNext(true);gNext();gFocus();return;
  }
  if(G.state!=='play')return;
  G.active+=dt;
  opAdvance(dt);
}
/* 나 */
function gNext(){
  const m=G.me;
  if(!m.queue.length){let r=G.pool.filter(x=>!m.done.has(x.w));if(!r.length)r=G.pool.slice();m.queue=shuffle(r);}
  if(m.cur&&m.queue.length>1&&m.queue[0].w===m.cur.w)m.queue.push(m.queue.shift());
  m.cur=m.queue.shift();m.busy=false;
  const el=$('#gIn');el.value='';el.maxLength=m.cur.w.length+3;
  $('#gPrompt').textContent=m.cur.m;
  $('#gTiles').innerHTML=tiles(m.cur.w,'',false,false);
  $('#gLen').textContent=`${m.cur.w.length}글자${m.cur.w.includes('-')?' (하이픈 포함)':''}`;
  const fb=$('#gFb');fb.className='gfb';fb.textContent='';$('#gWarn').hidden=true;
}
function gInput(el){
  if(!G||G.state!=='play'||G.me.busy||!G.me.cur){el.value='';return;}
  $('#gTiles').innerHTML=tiles(G.me.cur.w,typedOf(el.value),false,false);
  $('#gWarn').hidden=!HANGUL.test(el.value);
}
function gSubmit(skip){
  if(!G||G.over||G.state!=='play')return;
  const m=G.me;if(m.busy||!m.cur)return;
  const el=$('#gIn'),v=el.value;
  if(!skip){
    if(HANGUL.test(v)){$('#gWarn').hidden=false;gFocus();return;}
    if(!norm(v)){gFocus();return;}
  }
  const w=m.cur,ok=!skip&&norm(v)===w.w.toLowerCase(),fb=$('#gFb');
  m.busy=true;
  if(ok){
    m.correct++;m.done.add(w.w);
    $('#meCnt').textContent=m.correct;$('#meBar').style.width=(m.correct/G.target*100)+'%';popAt('#meCnt');
    fb.className='gfb ok';fb.textContent='정답!';
    if(m.correct>=G.target){endGame(true);return;}
  }else{
    m.missed.set(w.w,w);
    const q=m.queue;q.splice(Math.min(3,q.length),0,w); /* 조금 뒤에 다시 나와요 */
    fb.className='gfb no';fb.innerHTML=`${skip?'':'아쉬워요 · '}정답은 <b lang="en">${esc(w.w)}</b>`;
  }
  setTimeout(()=>{if(G&&!G.over&&G.me.cur===w){gNext();gFocus();}},ok?500:1700);
  gFocus();
}
function popAt(sel){const n=$(sel);if(!n)return;const s=document.createElement('span');s.className='pop';s.textContent='+1';n.parentElement.appendChild(s);setTimeout(()=>s.remove(),950);}
/* 상대: 읽고, 치고, 가끔 머뭇거리고, 틀리거나 넘기기도 함 */
function opEstTPC(){const gm=gameMeta(),e=(gm.tpc*2+G.active)/(2+G.me.correct);return Math.max(gm.tpc*0.6,Math.min(e,gm.tpc*1.6));} /* 소연이가 한 문제에서 오래 막혀도 상대가 같이 멈추지는 않게 */
function opNext(first){
  const o=G.op,gm=gameMeta();
  const w=G.pool[Math.floor(Math.random()*G.pool.length)],L=w.w.length;
  let pc=0.6+0.3*gm.r-(L>=9?0.07:0)-(L>=12?0.06:0);pc=Math.max(0.45,Math.min(0.93,pc));
  const lead=o.correct-G.me.correct;
  let D=opEstTPC()*pc*G.k*rnd(0.7,1.35)/1.06-950; /* 한 개 맞히는 시간이 소연이와 비슷해지게 */
  if(lead>=3)D*=1.25;else if(lead<=-3)D*=0.85;
  D=Math.max(1500+L*100,Math.min(D,28000));
  const x=Math.random(),out=x<pc?'ok':x<pc+(1-pc)*0.6?'no':'skip';
  if(out==='skip')D*=1.3;
  const read=D*rnd(0.18,0.32),steps=[['',read+(first?rnd(300,900):0)]];
  if(out==='skip')steps.push(['생각 중…',D-read]);
  else{
    const t=D-read;
    if(Math.random()<0.28){const a=t*rnd(0.2,0.45),pz=t*rnd(0.2,0.35);steps.push(['입력 중…',a],['생각 중…',pz],['입력 중…',t-a-pz]);}
    else steps.push(['입력 중…',t]);
  }
  Object.assign(o,{steps,phase:0,left:steps[0][1],outcome:out,status:steps[0][0],rest:0});
  updateOp();
}
function opAdvance(dt){
  const o=G.op;
  if(o.rest>0){o.rest-=dt;if(o.rest<=0)opNext(false);return;}
  o.left-=dt;
  while(o.left<=0){
    o.phase++;
    if(o.phase>=o.steps.length){opFinish();return;}
    o.left+=o.steps[o.phase][1];o.status=o.steps[o.phase][0];
  }
  updateOp();
}
function opFinish(){
  const o=G.op;
  if(o.outcome==='ok'){o.correct++;o.status='맞힘';popAt('#opCnt');}
  else o.status=o.outcome==='no'?'틀림':'넘김';
  o.rest=rnd(700,1200);updateOp();
  if(o.correct>=G.target)endGame(false);
}
function updateOp(){
  const o=G.op;$('#opCnt').textContent=o.correct;$('#opBar').style.width=(o.correct/G.target*100)+'%';
  const st=$('#opStat');
  if(st&&st.textContent!==o.status){st.textContent=o.status;st.className='pstat'+(o.status==='맞힘'?' good':(o.status==='틀림'||o.status==='넘김')?' bad':'');}
}
function endGame(win){
  if(!G||G.over)return;
  G.over=true;G.state='over';clearInterval(G.tick);
  const gm=gameMeta();
  gm.r=Math.max(0.1,Math.min(0.9,gm.r+(win?0.06:-0.06)));
  if(G.me.correct>=3)gm.tpc=Math.round(gm.tpc*0.6+(G.active/G.me.correct)*0.4);
  save();
  const el=$('#gIn');if(el)el.blur();
  const g=G;setTimeout(()=>{if(G===g)renderGameOver(win);},win?700:1000);
}
function renderGameOver(win){
  const me=G.me.correct,op=G.op.correct,d=Math.abs(me-op),missed=[...G.me.missed.values()];
  const msg=win?(d>=3?'여유 있게 이겼어요.':'아슬아슬하게 이겼어요.'):(d<=2?'정말 아깝게 졌어요.':'다음 판에 다시 붙어 봐요.');
  let h=`<div class="res">
    <p class="eyebrow">대결 · ${esc(G.label)}</p>
    <p class="gwin${win?' win':''}">${win?'이겼어요!':'졌어요'}${win?CIRCLE_WIDE:''}</p>
    <p class="gscore"><span>나 <b>${me}</b></span><span>:</span><span><b>${op}</b> ${esc(G.op.name)}</span></p>
    <p class="res-msg">${msg}</p>
  </div>`;
  if(missed.length){
    h+=`<section class="panel"><h2 class="sh">이번 판에서 놓친 단어 ${missed.length}개</h2><ul class="wlist">${missed.map(w=>`<li>
      <p class="fb-w"><b lang="en">${esc(w.w)}</b>${spk(w.w)}<span class="fb-m">${esc(w.m)}</span></p>
      <div class="hint ${w.g}"><span class="hint-l">${GROUPS[w.g].full}</span>${esc(w.h)}</div></li>`).join('')}</ul></section>`;
  }
  h+=`<div class="actions"><button class="btn" data-act="game">한 판 더</button><button class="btn ghost" data-act="home">처음으로</button></div>`;
  $('#v-game').innerHTML=h;window.scrollTo(0,0);
}
function quitGame(){if(G){G.over=true;clearInterval(G.tick);}G=null;show('home');renderHome();}

/* ---------- 이벤트 ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act;
  if(a==='tab'){show(b.dataset.v);render(b.dataset.v);}
  else if(a==='pref'){const k=b.dataset.k,v=b.dataset.val;S.prefs[k]=k==='n'?Number(v):v;save();renderHome();}
  else if(a==='start')startNew();
  else if(a==='review')startReview();
  else if(a==='opt'){if(Q)choose(Number(b.dataset.k));}
  else if(a==='giveup'){if(Q)giveup();}
  else if(a==='next')next();
  else if(a==='oops'){if(Q){const it=Q.items[Q.i];if(it.done&&!it.ok){it.skip=!it.skip;renderQ();}}}
  else if(a==='say')speak(b.dataset.w);
  else if(a==='say-slow'){if(Q)speak(Q.items[Q.i].w.w,0.55);}
  else if(a==='sound'){S.prefs.sound=!S.prefs.sound;save();if(!S.prefs.sound&&TTS)TTS.cancel();if(Q)renderQ();}
  else if(a==='quit'){if(Q){Q.quitAsk=true;renderQ();}}
  else if(a==='quit-no'){if(Q){Q.quitAsk=false;renderQ();focusSpell();}}
  else if(a==='quit-yes'){Q=null;show('home');renderHome();}
  else if(a==='retry'){if(R){const ag=R.wrong.concat(R.hinted||[]);if(ag.length)startQuiz(ag,'practice','다시 풀기',R.mode);}}
  else if(a==='home'){if(G&&G.over)G=null;show('home');renderHome();}
  else if(a==='copy-result')copyText(resultText(),'fb-result');
  else if(a==='wday'){WV.day=b.dataset.val;renderWords();}
  else if(a==='wview'){WV.view=b.dataset.val;renderWords();}
  else if(a==='pday')togglePref('days',b.dataset.val);
  else if(a==='pgroup')togglePref('groups',b.dataset.val);
  else if(a==='pn'){S.prefs.n=Number(b.dataset.val);save();renderHome();}
  else if(a==='cover'){WV.cover=!WV.cover;renderWords();}
  else if(a==='tidy'){HV.tidy=!HV.tidy;renderHome();}
  else if(a==='tidy-no'){HV.tidy=false;renderHome();}
  else if(a==='tidy-keep'){const out=outKeys(),od=[...new Set(out.map(k=>BYW[k].d))].sort((x,y)=>x-y);out.forEach(k=>delete S.review[k]);HV.tidy=false;save();renderHome();toast(`Day ${od.join('·')} 단어 ${out.length}개를 지웠어요.`);}
  else if(a==='tidy-all'){const n=revKeys().length;S.review={};HV.tidy=false;save();renderHome();toast(`다시 볼 단어 ${n}개를 모두 지웠어요.`);}
  else if(a==='game')startGame();
  else if(a==='gskip')gSubmit(true);
  else if(a==='gquit'){if(G&&!G.over){G.ask=true;$('#gFoot').innerHTML=`<div class="quitask"><p>그만하면 이번 대결은 끝나요.</p><div class="row"><button class="sbtn" data-act="gquit-no">계속하기</button><button class="sbtn danger" data-act="gquit-yes">그만하기</button></div></div>`;}}
  else if(a==='gquit-no'){if(G){G.ask=false;G.last=performance.now();$('#gFoot').innerHTML=`<button class="sbtn" data-act="gquit">그만하기</button>`;gFocus();}}
  else if(a==='gquit-yes')quitGame();
  else if(a==='reveal'){if(WV.cover)b.classList.toggle('show');}
});
document.addEventListener('submit',e=>{
  if(e.target.id==='spellForm'){e.preventDefault();if(Q)submitSpell($('#spellIn').value);}
  else if(e.target.id==='gForm'){e.preventDefault();gSubmit(false);}
});
document.addEventListener('input',e=>{if(e.target.id==='gIn')gInput(e.target);});
/* 대결 중 버튼을 눌러도 입력칸 포커스가 유지되게 (휴대폰 자판이 닫히지 않게) */
document.addEventListener('mousedown',e=>{if(e.target.closest&&e.target.closest('#gForm button,[data-act=gskip]'))e.preventDefault();});
document.addEventListener('input',e=>{
  if(e.target.id!=='spellIn'||!Q)return;
  const it=Q.items[Q.i];it.draft=e.target.value;
  $('#tiles').outerHTML=tiles(it.w.w,typedOf(it.draft),false,it.hint);
  $('#imeWarn').hidden=!HANGUL.test(it.draft);
});
document.addEventListener('keydown',e=>{
  if(cur==='words'&&e.key==='Enter'&&e.target.classList&&e.target.classList.contains('wrow')){e.target.click();return;}
  if(!Q||cur!=='quiz'||e.repeat)return;
  if(e.target.closest&&e.target.closest('button,input,textarea'))return;
  const it=Q.items[Q.i];
  if(it.done&&e.key==='Enter'&&Date.now()-Q.answeredAt>350){e.preventDefault();next();}
  else if(!it.done&&it.mode==='mc'&&/^[1-4]$/.test(e.key))choose(Number(e.key)-1);
});
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'&&['home','words'].includes(cur)){renderHeader();render(cur);}
});

renderHeader();renderHome();show('home');
</script>
